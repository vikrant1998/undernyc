[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "undernyc-backend"
version = "0.1.0"
description = "Live MTA subway positioning backend for the UnderNYC AR demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "gtfs-realtime-bindings>=1.0.0,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/undernyc_backend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

