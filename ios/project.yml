name: UnderNYC
options:
  bundleIdPrefix: com.viksat98
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: R7VKCFY66X
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: NO
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  UnderNYC:
    type: application
    platform: iOS
    sources:
      - UnderNYC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viksat98.UnderNYC
        INFOPLIST_FILE: UnderNYC/Info.plist
        PRODUCT_NAME: UnderNYC
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - UnderNYCTests
  UnderNYCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UnderNYCTests
    dependencies:
      - target: UnderNYC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viksat98.UnderNYCTests
        GENERATE_INFOPLIST_FILE: YES
